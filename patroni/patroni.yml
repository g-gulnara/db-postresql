scope: "${PATRONI_SCOPE}"
name: "${PATRONI_NAME}"

etcd3:
  hosts: "${PATRONI_ETCD3_HOSTS}"

restapi:
  listen: "${PATRONI_RESTAPI_LISTEN}"
  connect_address: "${PATRONI_NAME}:8008"

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: logical
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_log_hints: "on"
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5
  users:
    ${POSTGRES_USER}:
      password: "${POSTGRES_PASSWORD}"
      options:
        - createdb
        - createrole
  post_bootstrap: |
    psql -c "CREATE DATABASE ${POSTGRES_DB};"

postgresql:
  listen: "${PATRONI_POSTGRESQL_LISTEN}"
  connect_address: "${PATRONI_NAME}:5432"
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/17/bin
  pgpass: /tmp/pgpass
  authentication:
    superuser:
      username: "${POSTGRES_USER}"
      password: "${POSTGRES_PASSWORD}"
    replication:
      username: replicator
      password: "${REPLICATOR_PASSWORD}"
  parameters:
    unix_socket_directories: '/var/run/postgresql'

pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host replication debezium_user 0.0.0.0/0 md5
    - host all debezium_user 0.0.0.0/0 md5
    - host all metabase_user 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5