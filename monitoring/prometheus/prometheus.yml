global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'backup'
    static_configs:
      - targets: ['backup:9200']

  - job_name: 'patroni1'
    metrics_path: /metrics
    static_configs:
      - targets: ['patroni1:8008']
        labels:
          node: 'patroni1'
          cluster: 'library-cluster'

  - job_name: 'patroni2'
    metrics_path: /metrics
    static_configs:
      - targets: ['patroni2:8008']
        labels:
          node: 'patroni2'
          cluster: 'library-cluster'
